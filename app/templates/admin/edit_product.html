{% extends "base.html" %}

{% block content %}

<div class="container mt-5">

    <h2>Edit Product</h2>

    <form method="POST">

        <div class="mb-3">
            <label>Name</label>
            <input type="text"
                   class="form-control"
                   name="name"
                   value="{{ product.name }}"
                   required>
        </div>

        <div class="mb-3">
            <label>Description</label>
            <textarea
                class="form-control"
                name="description">{{ product.description }}</textarea>
        </div>

        <div class="mb-3">
            <label>Category</label>
            <input type="text"
                   class="form-control"
                   name="category"
                   value="{{ product.category }}"
                   required>
        </div>

        <div class="mb-3">
            <label>Price</label>
            <input type="number"
                   step="0.01"
                   class="form-control"
                   name="price"
                   value="{{ product.price }}"
                   required>
        </div>

        <div class="mb-3">
            <label>Stock</label>
            <input type="number"
                   class="form-control"
                   name="stock"
                   value="{{ product.stock }}"
                   required>
        </div>

        <button class="btn btn-primary">
            Update Product
        </button>

        <a href="{{ url_for('admin.products') }}"
           class="btn btn-secondary">
            Cancel
        </a>

    </form>

</div>

{% endblock %}
