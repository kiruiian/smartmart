{% extends "base.html" %}

{% block content %}

<div class="container mt-5">

<h2>Products</h2>

<a href="{{ url_for('admin.add_product') }}"
class="btn btn-success mb-3">
Add Product
</a>

<table class="table table-bordered">

<thead>

<tr>

<th>ID</th>

<th>Name</th>

<th>Category</th>

<th>Price</th>

<th>Stock</th>

</tr>

</thead>

<tbody>

{% for product in products %}

<tr>

<td>{{ product.id }}</td>

<td>{{ product.name }}</td>

<td>{{ product.category }}</td>

<td>KSh {{ product.price }}</td>

<td>{{ product.stock }}</td>

</tr>

{% endfor %}

</tbody>

</table>

</div>

{% endblock %}
