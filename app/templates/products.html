{% extends "base.html" %}

{% block title %}Products | SmartMart{% endblock %}

{% block content %}

<h2 class="mb-4">🛍️ Products</h2>

<div class="row">

{% for product in products %}

<div class="col-md-4 mb-4">

    <div class="card shadow-sm h-100">

        <div class="card-body text-center">

            <div style="font-size:70px;">📦</div>

            <h5>{{ product.name }}</h5>
            <p class="text-muted">
                {{ product.category }}

</p>

            <p>
                Stock:
                <strong>{{ product.stock }}</strong>
</p>

            <h4 class="text-success">
                KSh {{ product.price }}
            </h4>

            <a href="{{ url_for('customer.add_to_cart', product_id=product.id) }}"
                class="btn btn-success w-100">
                🛒 Add to Cart
            </a>

        </div>

    </div>

</div>

{% endfor %}

</div>

{% endblock %}
